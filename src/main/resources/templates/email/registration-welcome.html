<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:32px 16px;background-color:#EFEDE4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;">
  <tr><td th:insert="~{email/fragments/header :: header}"></td></tr>
  <tr>
    <td style="background-color:#FFFFFF;border-radius:16px;border:1px solid #CDE5D6;padding:32px;font-family:Arial,Helvetica,sans-serif;">
      <h1 style="margin:0 0 12px;font-size:22px;color:#26262E;" th:text="${heading}">Welcome to Gruhasti!</h1>
      <p style="margin:0 0 4px;font-size:15px;line-height:1.6;color:#3F5C50;">
        Hi <span th:text="${firstName}">there</span>,
      </p>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3F5C50;" th:text="${bodyText}">
        Your Gruhasti.vip account is ready. Sign in once to shop Pen2Paper, Shuddha, and everything
        else on Gruhasti — all your orders, one account.
      </p>
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
          <td style="border-radius:999px;background-color:#2E9E74;">
            <a th:href="${buttonUrl}" href="#"
               style="display:inline-block;padding:12px 26px;font-size:14px;font-weight:bold;color:#FFFFFF;text-decoration:none;"
               th:text="${buttonLabel}">
              Start shopping
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr><td th:insert="~{email/fragments/footer :: footer}"></td></tr>
</table>
</body>
</html>
