<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:32px 16px;background-color:#EFEDE4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;">
  <tr><td th:insert="~{email/fragments/header :: header}"></td></tr>
  <tr>
    <td style="background-color:#FFFFFF;border-radius:16px;border:1px solid #CDE5D6;padding:32px;font-family:Arial,Helvetica,sans-serif;">
      <h1 style="margin:0 0 12px;font-size:22px;color:#26262E;" th:text="${heading}">New sign-in to your account</h1>
      <p style="margin:0 0 4px;font-size:15px;line-height:1.6;color:#3F5C50;">
        Hi <span th:text="${firstName}">there</span>,
      </p>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#3F5C50;" th:text="${bodyText}">
        We noticed a sign-in from a browser or device we haven't seen before:
      </p>
      <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;background-color:#FBFEFC;border:1px solid #CDE5D6;border-radius:10px;margin:0 0 20px;">
        <tr>
          <td style="padding:14px 16px;font-size:13px;color:#26262E;">
            <div><strong>Browser:</strong> <span th:text="${browserFamily}">Unknown</span></div>
            <div><strong>Device:</strong> <span th:text="${osFamily}">Unknown</span></div>
            <div><strong>Time:</strong> <span th:text="${signedInAt}">just now</span></div>
          </td>
        </tr>
      </table>
      <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#3F5C50;">
        If this was you, no action is needed. If you don't recognize this activity, reset your
        password right away.
      </p>
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
          <td style="border-radius:999px;border:1.5px solid #2E9E74;">
            <a th:href="${buttonUrl}" href="#"
               style="display:inline-block;padding:11px 24px;font-size:14px;font-weight:bold;color:#1F6F4F;text-decoration:none;"
               th:text="${buttonLabel}">
              Not you? Reset your password
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr><td th:insert="~{email/fragments/footer :: footer}"></td></tr>
</table>
</body>
</html>
